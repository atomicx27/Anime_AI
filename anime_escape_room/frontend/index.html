<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Escape Room AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            min-height: 100vh;
        }
        .code-font {
            font-family: 'Fira Code', monospace;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        .smooth-hover {
            transition: all 0.3s ease;
        }
        .smooth-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3);
            border-color: rgba(56, 189, 248, 0.5);
        }
        .role-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        #loadingState {
            display: none;
        }
        #resultsContainer {
            display: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-8">

        <!-- Header -->
        <header class="text-center space-y-4 pt-8">
            <h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 text-glow">Anime Escape Room AI</h1>
            <p class="text-slate-400 max-w-2xl mx-auto text-lg">Submit an escape room theme, and the AI will assemble a team of anime characters and simulate their escape attempt based on their distinct personalities.</p>
        </header>

        <!-- Input Section -->
        <section class="glass-panel rounded-2xl p-6 md:p-8 max-w-3xl mx-auto">
            <div class="space-y-4">
                <label for="themeInput" class="block text-sm font-semibold text-cyan-400 uppercase tracking-wider">Escape Room Theme / Puzzle Type</label>
                <textarea id="themeInput" rows="3" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 smooth-hover" placeholder="e.g., A haunted Victorian mansion with hidden passages, or a futuristic sci-fi laboratory with lasers..."></textarea>
                <button id="submitBtn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 text-white font-bold py-4 px-8 rounded-xl shadow-lg shadow-cyan-900/50 transition-all active:scale-95 flex justify-center items-center gap-2">
                    <span>Initialize Simulation</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </button>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loadingState" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-400 mb-4"></div>
            <p class="text-cyan-400 font-mono animate-pulse">Analyzing character psychological profiles & assembling team...</p>
        </div>

        <!-- Results Section -->
        <section id="resultsContainer" class="space-y-8 animate-fade-in">

            <!-- Assigned Roles Grid -->
            <div class="glass-panel rounded-2xl p-6">
                <h2 class="text-2xl font-bold mb-6 text-cyan-400 border-b border-slate-700 pb-2">Team Roster</h2>
                <div id="rolesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Escape Log -->
            <div class="glass-panel rounded-2xl p-6">
                <h2 class="text-2xl font-bold mb-6 text-blue-400 border-b border-slate-700 pb-2">Simulation Log</h2>
                <div id="escapeLog" class="bg-slate-900/80 rounded-xl p-6 code-font text-sm text-green-400 space-y-3 h-96 overflow-y-auto border border-slate-700">
                    <!-- Populated by JS -->
                </div>
            </div>

        </section>
    </div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const theme = document.getElementById('themeInput').value.trim();
            if (!theme) return alert('Please enter an escape room theme.');

            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('loadingState').style.display = 'block';

            try {
                const response = await fetch('/api/escape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theme })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                renderResults(data);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to simulate escape. Ensure backend is running.');
            } finally {
                document.getElementById('loadingState').style.display = 'none';
            }
        });

        function renderResults(data) {
            const rolesGrid = document.getElementById('rolesGrid');
            const escapeLog = document.getElementById('escapeLog');

            rolesGrid.innerHTML = '';
            escapeLog.innerHTML = '';

            // Render Roles
            const roleIcons = {
                "Leader": "👑",
                "Codebreaker": "🧠",
                "Brawn": "💪",
                "Scout": "👁️"
            };

            for (const [role, char] of Object.entries(data.roles)) {
                if(!char) continue;
                rolesGrid.innerHTML += `
                    <div class="role-card rounded-xl p-4 smooth-hover border-t-2 border-t-cyan-500">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-2xl">${roleIcons[role] || '✨'}</span>
                            <h3 class="font-bold text-lg text-slate-100">${role}</h3>
                        </div>
                        <p class="text-cyan-300 font-semibold mb-1">${char.name}</p>
                        <p class="text-xs text-slate-400 mt-2 italic line-clamp-3" title="${char.personality_profile}">${char.personality_profile}</p>
                    </div>
                `;
            }

            // Render Log with staggered delay
            document.getElementById('resultsContainer').style.display = 'block';

            data.log.forEach((line, index) => {
                setTimeout(() => {
                    const p = document.createElement('p');
                    if (line.includes('---')) {
                        p.className = "text-cyan-400 font-bold mt-4";
                    } else if (line.includes(data.roles["Leader"]?.name)) {
                        p.className = "text-yellow-400";
                    } else if (line.includes(data.roles["Brawn"]?.name)) {
                        p.className = "text-red-400";
                    } else {
                        p.className = "text-green-400";
                    }
                    p.innerHTML = '> ' + line;
                    escapeLog.appendChild(p);
                    escapeLog.scrollTop = escapeLog.scrollHeight;
                }, index * 800); // 800ms delay between log lines
            });
        }
    </script>
</body>
</html>
