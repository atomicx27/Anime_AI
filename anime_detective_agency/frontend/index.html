<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Detective Agency AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-glow: rgba(99, 102, 241, 0.5);
            --secondary-glow: rgba(168, 85, 247, 0.4);
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%), radial-gradient(circle at bottom left, #0f172a, #020617 80%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 1.25rem;
        }

        .glass-hover {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-hover:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 20px var(--primary-glow);
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(30, 41, 59, 0.8);
        }

        .text-glow {
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .role-badge {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: white;
            padding: 0.35rem 1rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(147, 51, 234, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Animations */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .scanline-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(99, 102, 241, 0.05) 51%, transparent 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        .card-enter {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .log-enter {
            opacity: 0;
            transform: translateX(-20px);
            animation: slideInRight 0.4s ease-out forwards;
        }

        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }

        .terminal-font {
            font-family: 'Fira Code', monospace;
        }

        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
            100% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
    </style>
</head>
<body class="p-4 md:p-8 relative">
    <div class="scanline-effect"></div>

    <div class="max-w-7xl mx-auto relative z-10">
        <header class="text-center mb-16 mt-8">
            <div class="inline-block relative">
                <i class="fas fa-fingerprint absolute -left-12 top-2 text-3xl text-indigo-500/50"></i>
                <h1 class="text-5xl md:text-6xl font-black mb-4 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 text-glow tracking-tight">
                    Anime Detective Agency
                </h1>
                <i class="fas fa-search absolute -right-12 top-2 text-3xl text-pink-500/50"></i>
            </div>
            <p class="text-xl text-indigo-200/80 font-medium tracking-wide mt-2">Central AI Command Interface</p>
        </header>

        <main class="grid grid-cols-1 xl:grid-cols-3 gap-8">
            <!-- Input Section -->
            <div class="xl:col-span-1 space-y-6">
                <div class="glass-panel p-8 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
                    <h2 class="text-xl font-bold mb-6 flex items-center text-white/90">
                        <i class="fas fa-folder-open text-indigo-400 mr-3 text-xl"></i>
                        Open New Case File
                    </h2>
                    <div class="relative">
                        <textarea id="mysteryInput" rows="6"
                            class="w-full bg-slate-900/50 border border-indigo-500/30 rounded-xl p-5 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-400 transition-all placeholder-slate-500 font-medium resize-none shadow-inner"
                            placeholder="Describe the crime scene, timeline, and any initial suspects..."></textarea>
                        <div class="absolute bottom-4 right-4 text-indigo-500/30">
                            <i class="fas fa-microphone-alt"></i>
                        </div>
                    </div>
                    <button id="investigateBtn" class="w-full mt-6 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 px-4 rounded-xl shadow-[0_0_20px_rgba(99,102,241,0.4)] hover:shadow-[0_0_30px_rgba(168,85,247,0.6)] transition-all transform hover:-translate-y-1 flex justify-center items-center gap-3 border border-white/10 group">
                        <span>Deploy Investigation Team</span>
                        <i class="fas fa-paper-plane group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingSection" class="xl:col-span-2 glass-panel p-16 flex flex-col items-center justify-center min-h-[400px]" style="display: none;">
                <div class="relative w-32 h-32 mb-8 flex items-center justify-center">
                    <div class="absolute inset-0 border-4 border-indigo-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-t-indigo-500 rounded-full animate-spin"></div>
                    <div class="absolute inset-4 border-4 border-l-purple-500 rounded-full animate-[spin_2s_linear_infinite_reverse]"></div>
                    <i class="fas fa-brain text-3xl text-indigo-400 animate-pulse"></i>
                </div>
                <h3 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400 mb-2">Analyzing Crime Scene</h3>
                <p class="text-slate-400 terminal-font text-sm flex items-center gap-2">
                    <span class="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></span>
                    Cross-referencing database...
                </p>
            </div>

            <!-- Results Section -->
            <div class="xl:col-span-2 space-y-8" id="resultsSection" style="display: none;">

                <!-- Team Section -->
                <div>
                    <h2 class="text-2xl font-bold mb-6 text-white/90 flex items-center gap-3">
                        <i class="fas fa-users-viewfinder text-purple-400"></i>
                        Assigned Task Force
                    </h2>
                    <div id="teamContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                        <!-- Team members will be inserted here -->
                    </div>
                </div>

                <!-- Investigation Log -->
                <div class="glass-panel overflow-hidden border border-indigo-500/20">
                    <div class="bg-slate-900/80 border-b border-indigo-500/20 px-6 py-4 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-white/90 flex items-center gap-3">
                            <i class="fas fa-terminal text-indigo-400"></i>
                            Live Investigation Feed
                        </h2>
                        <div class="flex gap-2">
                            <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                            <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                        </div>
                    </div>
                    <div id="logContainer" class="p-6 space-y-5 max-h-[500px] overflow-y-auto bg-slate-950/50">
                        <!-- Logs will be inserted here -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        document.getElementById('investigateBtn').addEventListener('click', async () => {
            const mystery = document.getElementById('mysteryInput').value.trim();
            if (!mystery) {
                // Simple visual shake if empty
                const input = document.getElementById('mysteryInput');
                input.classList.add('animate-[bounce_0.5s]');
                setTimeout(() => input.classList.remove('animate-[bounce_0.5s]'), 500);
                return;
            }

            // UI updates for loading
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'flex';
            const btn = document.getElementById('investigateBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Analyzing...';
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                const response = await fetch('/api/investigate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mystery })
                });

                if (!response.ok) throw new Error('API request failed');
                const data = await response.json();

                // Artificial delay for dramatic effect
                setTimeout(() => {
                    renderResults(data);
                }, 1500);

            } catch (error) {
                console.error('Error:', error);
                alert('Failed to investigate. Check console for details.');
                document.getElementById('loadingSection').style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = 'Deploy Investigation Team <i class="fas fa-paper-plane ml-2"></i>';
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });

        function renderResults(data) {
            document.getElementById('loadingSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';

            const btn = document.getElementById('investigateBtn');
            btn.disabled = false;
            btn.innerHTML = 'Open Another Case <i class="fas fa-redo ml-2"></i>';
            btn.classList.remove('opacity-70', 'cursor-not-allowed');

            // Render Team
            const teamContainer = document.getElementById('teamContainer');
            teamContainer.innerHTML = '';

            data.team.forEach((member, index) => {
                // Role specific styling
                let roleIcon = 'fa-user-secret';
                let roleColor = 'from-indigo-500 to-purple-500';

                if (member.role.includes('Lead')) { roleIcon = 'fa-id-badge'; roleColor = 'from-blue-500 to-cyan-500'; }
                else if (member.role.includes('Forensics')) { roleIcon = 'fa-microscope'; roleColor = 'from-emerald-500 to-teal-500'; }
                else if (member.role.includes('Interrogator')) { roleIcon = 'fa-gavel'; roleColor = 'from-red-500 to-orange-500'; }
                else if (member.role.includes('Profiler')) { roleIcon = 'fa-brain'; roleColor = 'from-fuchsia-500 to-pink-500'; }

                const cardHtml = `
                    <div class="glass-panel bg-slate-800/40 p-5 text-center glass-hover card-enter relative overflow-hidden group" style="animation-delay: ${index * 0.15}s">
                        <div class="absolute inset-0 bg-gradient-to-br ${roleColor} opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r ${roleColor}"></div>

                        <div class="relative inline-block mb-4 mt-2">
                            <div class="absolute inset-0 bg-gradient-to-r ${roleColor} rounded-full blur-md opacity-50 group-hover:opacity-80 transition-opacity"></div>
                            <img src="${member.character.avatar}" alt="${member.character.name}" class="w-20 h-20 relative mx-auto rounded-full bg-slate-900 border-2 border-white/20 object-cover z-10">
                            <div class="absolute -bottom-2 -right-2 bg-slate-900 border border-white/20 rounded-full w-8 h-8 flex items-center justify-center z-20 shadow-lg">
                                <i class="fas ${roleIcon} text-xs text-white/80"></i>
                            </div>
                        </div>

                        <h3 class="font-black text-lg text-white mb-2 tracking-tight group-hover:text-indigo-300 transition-colors">${member.character.name}</h3>
                        <div class="mb-3">
                            <span class="text-[10px] uppercase font-bold tracking-wider px-3 py-1 rounded-full bg-white/5 border border-white/10 text-slate-300">${member.role}</span>
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed line-clamp-3 bg-black/20 p-2 rounded-lg border border-black/30 shadow-inner">
                            ${member.character.unique_quality}
                        </p>
                    </div>
                `;
                teamContainer.insertAdjacentHTML('beforeend', cardHtml);
            });

            // Render Logs
            const logContainer = document.getElementById('logContainer');
            logContainer.innerHTML = '';

            let delay = 0;
            data.logs.forEach((log, index) => {
                setTimeout(() => {
                    const isSystem = log.character.name === 'System';

                    const logElement = document.createElement('div');
                    logElement.className = `log-enter relative pl-6 border-l-2 ${isSystem ? 'border-slate-500' : 'border-indigo-500'}`;

                    logElement.innerHTML = `
                        <div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full bg-slate-900 border-2 ${isSystem ? 'border-slate-500' : 'border-indigo-500'} flex items-center justify-center pulse-ring"></div>

                        <div class="bg-white/5 hover:bg-white/10 transition-colors rounded-xl p-4 border border-white/5 shadow-md">
                            <div class="flex items-start gap-4">
                                ${!isSystem ? `<img src="${log.character.avatar}" class="w-12 h-12 rounded-lg object-cover border border-white/10 shadow-sm shrink-0" alt="avatar">` : ''}

                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-3 mb-1">
                                        <h4 class="font-bold ${isSystem ? 'text-slate-400' : 'text-indigo-300'}">${log.character.name}</h4>
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 bg-slate-900/50 px-2 py-0.5 rounded border border-slate-700">${log.action}</span>
                                    </div>
                                    <p class="text-slate-200 text-sm leading-relaxed ${isSystem ? 'terminal-font italic opacity-80' : ''}">
                                        ${isSystem ? log.message : `<span class="text-indigo-500/50 mr-1">"</span>${log.message}<span class="text-indigo-500/50 ml-1">"</span>`}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                    logContainer.appendChild(logElement);

                    // Smooth scroll to bottom
                    logContainer.scrollTo({
                        top: logContainer.scrollHeight,
                        behavior: 'smooth'
                    });

                }, delay);

                // Increase delay for next log to create a typing/thinking effect
                delay += 1200 + Math.random() * 800;
            });
        }
    </script>
</body>
</html>
