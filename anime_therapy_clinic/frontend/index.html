<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Therapy Clinic AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        .fira-code {
            font-family: 'Fira Code', monospace;
        }
        .glass-panel {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 0 20px rgba(139, 92, 246, 0.15);
        }
        .smooth-hover {
            transition: all 0.3s ease;
        }
        .smooth-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 0 25px rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.5);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.15); }
            50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); }
        }
        .animate-glow {
            animation: pulse-glow 3s infinite;
        }

        /* Custom scrollbar for terminal */
        #terminalLog::-webkit-scrollbar {
            width: 8px;
        }
        #terminalLog::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
        }
        #terminalLog::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-8">

        <!-- Header -->
        <header class="text-center space-y-4 pt-8 pb-4">
            <h1 class="text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 text-glow">Anime Therapy Clinic</h1>
            <p class="text-slate-300 max-w-2xl mx-auto text-lg">Confide your struggles, stress, or moral dilemmas. The AI will assign specialized characters to provide Empathetic, Tough Love, and Philosophical advice based on their core traits.</p>
        </header>

        <!-- Input Section -->
        <div class="glass-panel p-6 md:p-8 animate-glow">
            <h2 class="text-2xl font-semibold mb-4 text-purple-300">Intake Form</h2>
            <textarea id="problemInput" rows="4" class="w-full bg-slate-900/50 border border-slate-600 rounded-lg p-4 text-slate-200 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors" placeholder="What's weighing on your mind today?"></textarea>
            <div class="mt-4 flex justify-end">
                <button id="submitBtn" onclick="submitProblem()" class="px-8 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-lg smooth-hover shadow-lg flex items-center gap-2">
                    <span>Begin Session</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Terminal Log Section -->
        <div id="terminalContainer" class="hidden">
            <div class="glass-panel p-4 bg-slate-950/80 border-slate-700">
                <div class="flex items-center gap-2 mb-3 border-b border-slate-800 pb-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="text-slate-500 text-xs font-semibold fira-code ml-2">system_evaluation.log</span>
                </div>
                <div id="terminalLog" class="fira-code text-sm text-green-400 h-48 overflow-y-auto space-y-1">
                    <!-- Typing effect logs go here -->
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsContainer" class="hidden space-y-6">
            <h2 class="text-3xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-purple-300 text-glow">Your Therapy Session</h2>
            <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Character advice cards go here -->
            </div>
        </div>

    </div>

    <script>
        async function typeLog(message, delay = 10) {
            const logArea = document.getElementById('terminalLog');
            const p = document.createElement('p');
            p.className = 'opacity-0 transition-opacity duration-300';
            logArea.appendChild(p);

            // Scroll to bottom
            logArea.scrollTop = logArea.scrollHeight;

            let currentText = '> ';
            p.textContent = currentText;
            p.classList.remove('opacity-0');

            for (let i = 0; i < message.length; i++) {
                currentText += message.charAt(i);
                p.textContent = currentText;
                await new Promise(resolve => setTimeout(resolve, delay));
            }

            await new Promise(resolve => setTimeout(resolve, 50)); // Pause after line
        }

        async function submitProblem() {
            const input = document.getElementById('problemInput').value.trim();
            if (!input) return;

            const submitBtn = document.getElementById('submitBtn');
            const terminalContainer = document.getElementById('terminalContainer');
            const terminalLog = document.getElementById('terminalLog');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsGrid = document.getElementById('resultsGrid');

            // Reset UI
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...`;

            terminalLog.innerHTML = '';
            terminalContainer.classList.remove('hidden');
            resultsContainer.classList.add('hidden');
            resultsGrid.innerHTML = '';

            try {
                await typeLog("Initializing Therapy Agent Module...");
                await typeLog(`Analyzing user intake form...`);

                const response = await fetch('/api/therapy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ problem: input })
                });

                if (!response.ok) throw new Error('API request failed');

                const data = await response.json();

                await typeLog("Evaluating character database for optimal psychological resonance...");

                for (const member of data.team) {
                    await typeLog(`Assigning [${member.role}] role to ${member.character.name}...`);
                    await typeLog(`  -> Core Emotion: ${member.character.core_emotion}`);
                }

                await typeLog("Synthesizing personalized advice...");
                await typeLog("Session ready. Displaying results.");

                // Render Results
                data.advice.forEach((item, index) => {
                    const char = item.character;
                    let badgeColor = '';
                    let icon = '';

                    if (item.role === 'Empathetic Listener') {
                        badgeColor = 'bg-pink-500/20 text-pink-300 border-pink-500/50';
                        icon = '❤️';
                    } else if (item.role === 'Tough Love Coach') {
                        badgeColor = 'bg-orange-500/20 text-orange-300 border-orange-500/50';
                        icon = '🔥';
                    } else {
                        badgeColor = 'bg-blue-500/20 text-blue-300 border-blue-500/50';
                        icon = '🧠';
                    }

                    const card = document.createElement('div');
                    card.className = 'glass-panel p-6 flex flex-col gap-4 smooth-hover opacity-0 translate-y-4';
                    card.style.transition = `all 0.5s ease ${index * 0.2}s`;

                    card.innerHTML = `
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <h3 class="text-xl font-bold text-white">${char.name}</h3>
                                <p class="text-sm text-slate-400">${char.archetype}</p>
                            </div>
                            <span class="px-3 py-1 text-xs font-semibold rounded-full border ${badgeColor}">
                                ${icon} ${item.role}
                            </span>
                        </div>

                        <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50 flex-grow relative">
                            <div class="absolute -top-3 -left-2 text-4xl text-slate-600 opacity-50">"</div>
                            <p class="text-slate-200 italic relative z-10 leading-relaxed text-sm md:text-base">${item.message}</p>
                        </div>

                        <div class="mt-auto pt-4 border-t border-slate-700/50">
                            <p class="text-xs text-slate-400"><strong class="text-slate-300">Philosophy:</strong> ${char.unique_quality}</p>
                        </div>
                    `;

                    resultsGrid.appendChild(card);

                    // Trigger reflow to ensure animation runs
                    void card.offsetWidth;
                    card.classList.remove('opacity-0', 'translate-y-4');
                });

                resultsContainer.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                await typeLog(`ERROR: ${error.message}`, 10);
                alert("An error occurred during the session. Please try again.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <span>Begin Session</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                    </svg>
                `;
            }
        }
    </script>
</body>
</html>
